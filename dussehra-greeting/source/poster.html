<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Happy Dussehra</title>
<style>
@font-face{font-family:'Cinzel';src:url(fonts/Cinzel.ttf);font-weight:400 900}
@font-face{font-family:'Yatra';src:url(fonts/YatraOne.ttf)}
@font-face{font-family:'Fredoka';src:url(fonts/Fredoka.ttf);font-weight:300 700}
@font-face{font-family:'Nunito';src:url(fonts/Nunito.ttf);font-weight:200 1000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 42%,#8a1c1c 0%,#5c0f17 42%,#2c0610 100%)}
.abs{position:absolute}
.cx{left:0;width:1080px;text-align:center}
.gold{background:linear-gradient(180deg,#fff3b0 0%,#ffd45c 38%,#e09a1f 70%,#ffe08a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #5a1a05) drop-shadow(0 0 24px rgba(255,190,60,.45))}
#shine{position:absolute;left:0;width:1080px;top:600px;height:300px;pointer-events:none;mix-blend-mode:overlay}
canvas{position:absolute;left:0;top:0}
.disc{position:absolute;border-radius:50%;overflow:hidden;background:#fff;border:6px solid #ffd45c;box-shadow:0 0 0 10px rgba(255,212,92,.25),0 20px 50px rgba(0,0,0,.5)}
.disc img{position:absolute}
</style>
</head>
<body>
<div id="stage">
  <!-- rotating mandala -->
  <svg id="mandala" class="abs" style="left:90px;top:330px" width="900" height="900" viewBox="-450 -450 900 900">
    <g id="mg" fill="none" stroke="#ffcf5a" stroke-width="2.4"></g>
  </svg>
  <canvas id="fx" width="1080" height="1920"></canvas>

  <!-- marigold toran -->
  <svg id="toran" class="abs" style="left:0;top:0" width="1080" height="330" viewBox="0 0 1080 330"></svg>

  <!-- bow & arrow -->
  <svg id="bow" class="abs" style="left:40px;top:520px" width="260" height="520" viewBox="0 0 260 520">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e09a1f"/><stop offset="1" stop-color="#ffe08a"/></linearGradient></defs>
    <path id="bowArc" d="M120 20 C 20 140 20 380 120 500" fill="none" stroke="url(#bg)" stroke-width="16" stroke-linecap="round" pathLength="1"/>
    <path id="bowStr" d="M120 20 L 120 500" fill="none" stroke="#fff1c2" stroke-width="4" pathLength="1"/>
  </svg>
  <svg id="arrow" class="abs" style="left:80px;top:730px" width="300" height="60" viewBox="0 0 300 60">
    <path d="M10 30 H260" stroke="#ffd45c" stroke-width="8" stroke-linecap="round"/>
    <path d="M250 12 L292 30 L250 48 Z" fill="#fff3b0" stroke="#e09a1f" stroke-width="3"/>
    <path d="M10 30 L-6 14 M10 30 L-6 46 M26 30 L10 14 M26 30 L10 46" stroke="#ff7a1a" stroke-width="6" stroke-linecap="round"/>
  </svg>

  <div id="t1" class="abs cx gold" style="top:610px;font-family:'Cinzel';font-weight:800;font-size:118px;letter-spacing:6px;line-height:1">HAPPY</div>
  <div id="t2" class="abs cx gold" style="top:740px;font-family:'Cinzel';font-weight:900;font-size:134px;letter-spacing:4px;line-height:1">DUSSEHRA</div>
  <svg id="orn" class="abs" style="left:240px;top:905px" width="600" height="40" viewBox="0 0 600 40">
    <path d="M10 20 H250 M350 20 H590" stroke="#ffd45c" stroke-width="3" pathLength="1" class="ol"/>
    <path d="M300 4 L316 20 L300 36 L284 20 Z" fill="#ffd45c"/><circle cx="262" cy="20" r="5" fill="#ffd45c"/><circle cx="338" cy="20" r="5" fill="#ffd45c"/>
  </svg>
  <div id="t3" class="abs cx" style="top:965px;font-family:'Yatra';font-size:74px;color:#fff1d0;text-shadow:0 4px 0 #3a0a0a,0 0 20px rgba(255,170,60,.4);line-height:1.3">दसऱ्याच्या हार्दिक शुभेच्छा!</div>
  <div id="t4" class="abs cx" style="top:1095px;font-family:'Nunito';font-weight:700;font-size:40px;color:#ffd9a0;line-height:1.35">May the victory of good over evil<br>light your path to knowledge &amp; success</div>

  <div id="logo" class="disc" style="left:430px;top:1260px;width:220px;height:220px"><img src="emblem.png" style="left:4px;top:4px;width:200px;height:200px"></div>
  <div id="t5" class="abs cx" style="top:1505px;font-family:'Fredoka';font-weight:600;font-size:62px;color:#fff;letter-spacing:1px">Rapid Mind’s <span style="color:#ffd45c">Tutorials</span></div>
  <div id="t6" class="abs cx" style="top:1585px;font-family:'Nunito';font-weight:700;font-size:32px;color:#ffcf9a;letter-spacing:3px">LINE ALI, OLD PANVEL</div>

  <svg id="diyas" class="abs" style="left:0;top:1680px" width="1080" height="240" viewBox="0 0 1080 240"></svg>
  <div id="fade" class="abs" style="inset:0;background:#000"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const s = 1.6; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function tf(id, o, x = 0, y = 0, s = 1, r = 0) { const e = typeof id === 'string' ? $(id) : id; e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1010);

/* mandala */
const mg = $('mg');
for (let ring = 0; ring < 4; ring++) {
  const r = 120 + ring * 85, n = 12 + ring * 6;
  el('circle', { r, opacity: .5 }, mg);
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, x = Math.cos(a) * r, y = Math.sin(a) * r;
    const pr = 26 + ring * 6;
    el('path', { d: `M${x} ${y} q ${Math.cos(a + 1.2) * pr} ${Math.sin(a + 1.2) * pr} ${Math.cos(a) * pr * 1.6} ${Math.sin(a) * pr * 1.6} q ${Math.cos(a - 1.2) * -pr} ${Math.sin(a - 1.2) * -pr} ${-Math.cos(a) * pr * 1.6} ${-Math.sin(a) * pr * 1.6}`, opacity: .7 }, mg);
  }
}
el('circle', { r: 60, opacity: .8 }, mg);

/* toran: garland strands + hanging marigold strings + mango leaves */
const toran = $('toran'); const torItems = [];
const cols = ['#ff9f1c', '#ffbf1f', '#ff7a1a'];
// main swag
for (let s = 0; s < 3; s++) {
  const x0 = s * 360, g = el('g', {}, toran); torItems.push({ g, d: s * .08, kind: 'swag' });
  for (let i = 0; i <= 18; i++) {
    const u = i / 18, x = x0 + u * 360, y = 20 + Math.sin(u * Math.PI) * 70;
    el('circle', { cx: x, cy: y, r: 17, fill: cols[(i + s) % 3] }, g);
    el('circle', { cx: x - 4, cy: y - 4, r: 6, fill: 'rgba(255,240,180,.55)' }, g);
  }
}
for (let i = 0; i < 9; i++) {
  const x = 60 + i * 120, len = 4 + (i % 2) * 3, g = el('g', {}, toran);
  torItems.push({ g, d: .25 + i * .04, kind: 'drop', x });
  // leaf
  el('path', { d: `M${x} 30 q 26 30 0 74 q -26 -44 0 -74z`, fill: '#2e8b3a', stroke: '#1f5e27', 'stroke-width': 2 }, g);
  for (let k = 0; k < len; k++) el('circle', { cx: x, cy: 70 + k * 30, r: 14, fill: cols[(k + i) % 3] }, g);
  el('circle', { cx: x, cy: 70 + len * 30 + 6, r: 9, fill: '#d6202a' }, g);
}

/* diyas */
const dg = $('diyas'); const flames = [];
for (let i = 0; i < 5; i++) {
  const x = 130 + i * 205, y = 150, g = el('g', {}, dg);
  el('ellipse', { cx: x, cy: y + 30, rx: 90, ry: 26, fill: 'rgba(255,160,40,.18)' }, g);
  el('path', { d: `M${x - 70} ${y} Q ${x} ${y + 70} ${x + 70} ${y} Q ${x + 40} ${y + 10} ${x} ${y + 8} Q ${x - 40} ${y + 10} ${x - 70} ${y} Z`, fill: '#c2581a', stroke: '#ffcc66', 'stroke-width': 3 }, g);
  el('path', { d: `M${x - 54} ${y + 14} Q ${x} ${y + 44} ${x + 54} ${y + 14}`, fill: 'none', stroke: '#ffdd88', 'stroke-width': 3, 'stroke-dasharray': '4 10' }, g);
  const glow = el('circle', { cx: x, cy: y - 34, r: 46, fill: 'rgba(255,190,80,.22)' }, g);
  const f = el('path', { fill: '#ffd447' }, g);
  const fi = el('path', { fill: '#fff6c8' }, g);
  flames.push({ x, y, f, fi, glow, g, p: R() * 6 });
}

/* particles (fireworks + embers) — deterministic, computed analytically from t */
const ctx = $('fx').getContext('2d');
const bursts = [
  { t: 5.45, x: 190, y: 430, n: 110, sp: 700, cols: ['#ffd45c', '#fff3b0', '#ff9f1c', '#ff5e3a'] },
  { t: 5.5, x: 890, y: 470, n: 110, sp: 700, cols: ['#ff7ab6', '#ffd45c', '#fff', '#ff9f1c'] },
  { t: 5.55, x: 540, y: 300, n: 70, sp: 420, cols: ['#7ee0ff', '#ffd45c', '#fff'] },
];
bursts.forEach(b => { b.parts = []; for (let i = 0; i < b.n; i++) b.parts.push({ a: R() * 6.283, v: (.35 + R() * .65) * b.sp, c: b.cols[i % b.cols.length], s: 2 + R() * 3, life: .9 + R() * .7 }); });
const embers = []; for (let i = 0; i < 60; i++) embers.push({ x: R() * 1080, y: R() * 1920, v: 40 + R() * 90, s: 1.5 + R() * 3, p: R() * 6, o: .3 + R() * .5 });

function drawFx(t) {
  ctx.clearRect(0, 0, 1080, 1920);
  ctx.globalCompositeOperation = 'lighter';
  const ev = eOut(prog(t, .3, 1.2));
  for (const e of embers) {
    const y = ((e.y - e.v * t) % 1920 + 1920) % 1920, x = e.x + Math.sin(t * 1.5 + e.p) * 20;
    ctx.fillStyle = `rgba(255,${170 + Math.floor(60 * Math.sin(e.p))},70,${(e.o * ev * (.6 + .4 * Math.sin(t * 5 + e.p))).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, e.s, 0, 6.283); ctx.fill();
  }
  for (const b of bursts) {
    const dt = t - b.t; if (dt < 0) continue;
    if (dt < .25) { // flash
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 260);
      g.addColorStop(0, `rgba(255,240,190,${(.7 * (1 - dt / .25)).toFixed(3)})`); g.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = g; ctx.fillRect(b.x - 260, b.y - 260, 520, 520);
    }
    for (const p of b.parts) {
      if (dt > p.life) continue;
      const k = 1 - Math.exp(-dt * 3.2);
      const d = p.v * k / 3.2 * 1.0;
      const x = b.x + Math.cos(p.a) * d, y = b.y + Math.sin(p.a) * d + 90 * dt * dt;
      const fade = 1 - dt / p.life;
      ctx.fillStyle = p.c; ctx.globalAlpha = fade * (.7 + .3 * Math.sin(dt * 40 + p.a * 10));
      ctx.beginPath(); ctx.arc(x, y, p.s * (0.6 + fade * .6), 0, 6.283); ctx.fill();
      // short trail
      const d2 = p.v * (1 - Math.exp(-Math.max(0, dt - .05) * 3.2)) / 3.2;
      ctx.strokeStyle = p.c; ctx.lineWidth = p.s * .6; ctx.globalAlpha *= .5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(b.x + Math.cos(p.a) * d2, b.y + Math.sin(p.a) * d2 + 90 * Math.max(0, dt - .05) ** 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

window.render = function (t) {
  $('fade').style.opacity = (1 - eOut(prog(t, 0, .5))).toFixed(3);
  // mandala
  const km = eOut(prog(t, .1, 1.2));
  $('mandala').style.opacity = (km * (.32 + .1 * Math.sin(t * 2))).toFixed(3);
  $('mandala').style.transform = `rotate(${(t * 12).toFixed(2)}deg) scale(${lerp(.7, 1, km).toFixed(4)})`;
  // toran drop
  torItems.forEach(it => {
    const k = prog(t, .15 + it.d, .85 + it.d);
    const y = lerp(-330, 0, eBack(k));
    const sway = it.kind === 'drop' ? Math.sin(t * 2.2 + it.x * .02) * 2.5 : 0;
    it.g.setAttribute('transform', `translate(0 ${y.toFixed(1)}) rotate(${sway.toFixed(2)} ${it.x || 540} 30)`);
  });
  // bow
  const kb = eInOut(prog(t, .5, 1.2));
  $('bowArc').setAttribute('stroke-dasharray', '1 1'); $('bowArc').setAttribute('stroke-dashoffset', 1 - kb);
  $('bowStr').setAttribute('stroke-dasharray', '1 1'); $('bowStr').setAttribute('stroke-dashoffset', 1 - eOut(prog(t, 1.0, 1.25)));
  // string pull then release
  const pull = prog(t, 1.25, 1.55) * (t < 1.6 ? 1 : 0);
  const sx = 120 - 50 * eOut(pull) + (t >= 1.6 ? Math.sin((t - 1.6) * 40) * 10 * Math.exp(-(t - 1.6) * 8) : 0);
  $('bowStr').setAttribute('d', `M120 20 L ${sx.toFixed(1)} 260 L 120 500`);
  $('bow').style.opacity = t < 1.95 ? 1 : (1 - prog(t, 1.95, 2.25)).toFixed(3);
  $('bow').style.transform = `translateX(${(-80 * prog(t, 1.95, 2.25)).toFixed(1)}px)`;
  // arrow
  const ka = prog(t, 1.6, 1.95);
  let ax = t < 1.6 ? -50 * eOut(pull) : lerp(-50, 380, eIn(ka));
  $('arrow').style.opacity = (prog(t, 1.15, 1.3) * (t < 1.95 ? 1 : 0)).toFixed(3);
  $('arrow').style.transform = `translateX(${ax.toFixed(1)}px)`;
  drawFx(t);
  // titles
  const k1 = prog(t, 1.95, 2.6), k2 = prog(t, 2.1, 2.8);
  tf('t1', clamp(k1 * 3), 0, 0, lerp(1.6, 1, eOut(k1)));
  tf('t2', clamp(k2 * 3), 0, 0, lerp(1.6, 1, eOut(k2)));
  const ko = eInOut(prog(t, 2.6, 3.1));
  $('orn').style.opacity = ko; $('orn').querySelector('.ol').setAttribute('stroke-dasharray', '1 1'); $('orn').querySelector('.ol').setAttribute('stroke-dashoffset', 1 - ko);
  const k3 = eOut(prog(t, 2.8, 3.5)); tf('t3', k3, 0, (1 - k3) * 40);
  const k4 = eOut(prog(t, 3.3, 4.0)); tf('t4', k4, 0, (1 - k4) * 30);
  const k5 = prog(t, 3.8, 4.5); tf('logo', clamp(k5 * 3), 0, 0, eBack(k5) * (1 + .015 * Math.sin(t * 3)), (1 - eOut(k5)) * -90);
  const k6 = eOut(prog(t, 4.2, 4.8)); tf('t5', k6, 0, (1 - k6) * 30);
  const k7 = eOut(prog(t, 4.5, 5.0)); tf('t6', k7, 0, (1 - k7) * 20);
  // gold shimmer pulse on title
  const sh = .45 + .25 * Math.sin(t * 4);
  $('t2').style.filter = `drop-shadow(0 6px 0 #5a1a05) drop-shadow(0 0 ${(18 + 16 * sh).toFixed(1)}px rgba(255,190,60,${sh.toFixed(2)}))`;
  // diyas
  const kd = eOut(prog(t, .4, 1.2));
  flames.forEach((f, i) => {
    f.g.style.opacity = clamp(kd * 1.5 - i * .08);
    const fl = 1 + .12 * Math.sin(t * 17 + f.p) + .06 * Math.sin(t * 29 + f.p * 2);
    const sw = 4 * Math.sin(t * 11 + f.p);
    const h = 52 * fl, x = f.x, y = f.y - 4;
    f.f.setAttribute('d', `M${x} ${y} C ${x - 20} ${y - 14} ${x - 14} ${y - h * .6} ${x + sw} ${y - h} C ${x + 14} ${y - h * .6} ${x + 20} ${y - 14} ${x} ${y} Z`);
    f.fi.setAttribute('d', `M${x} ${y - 2} C ${x - 9} ${y - 10} ${x - 6} ${y - h * .4} ${x + sw * .6} ${y - h * .62} C ${x + 6} ${y - h * .4} ${x + 9} ${y - 10} ${x} ${y - 2} Z`);
    f.glow.setAttribute('r', (44 * fl).toFixed(1));
  });
};
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
render(0);
</script>
</body>
</html>
